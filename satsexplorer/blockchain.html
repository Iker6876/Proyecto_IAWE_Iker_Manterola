<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockchain · SatsExplorer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="blockchain">
  <div id="cabecera"></div>

  <main class="contenedor">
    <div class="titulo">
      <div>
        <h1>Blockchain</h1>
        <p>Historial de bloques de tu nodo, del más reciente al génesis. Pulsa un bloque para ver su resumen.</p>
      </div>
    </div>

    <div id="avisos"></div>
    <section class="panel" id="resumen" hidden></section>

    <section class="panel">
      <h2>Historial de bloques</h2>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Altura</th><th>Hash</th><th>Fecha</th><th class="r">Transacciones</th><th class="r">Tamaño</th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <div class="centro"><button class="boton" id="mas" type="button">Cargar bloques anteriores</button></div>
    </section>
  </main>

  <div id="pie"></div>
  <script src="js/api.js"></script>
  <script src="js/blockchain.js"></script>
</body>
</html>
